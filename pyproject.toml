[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-governor"
version = "0.1.0"
description = "Sentinel-Governor AI Agent for NovaMart"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "google-genai",
    "httpx",
    "pytest",
    "python-dotenv",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:.*_UnionGenericAlias.*:DeprecationWarning",
    "ignore::DeprecationWarning:google.genai.*",
]
